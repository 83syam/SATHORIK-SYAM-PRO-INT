name: Supabase Keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            "https://ypdtvhbyzcjevlhhemjr.supabase.co/rest/v1/rpc/info_warung" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_slug":"keepalive"}'
          echo "Ping berhasil"
